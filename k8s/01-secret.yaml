# Secret to store sensitive data like the API token
# WARNING: Do not commit actual secrets to version control!
# Use Kubernetes sealed-secrets, Vault, or external secret managers in production
apiVersion: v1
kind: Secret
metadata:
  name: town-builder-secrets
  namespace: <YOUR_NAMESPACE> # Replace with your actual namespace
type: Opaque
stringData:
  # Replace with your actual JWT token for the external API
  TOWN_API_JWT_TOKEN: "<REPLACE_WITH_ACTUAL_JWT_TOKEN>"

  # JWT Secret Key (REQUIRED unless DISABLE_JWT_AUTH=true)
  # Generate a secure random string: openssl rand -hex 32
  JWT_SECRET_KEY: "<GENERATE_SECURE_RANDOM_STRING>"

  # Shared secret for the kibigia auth-code exchange flow.
  # MUST match kibigia's TOWN_BUILDER_EXCHANGE_SECRET exactly.
  # kibigia refuses to boot in production (DEBUG=False) if this is empty, and
  # its exchange endpoint rejects all redemptions without a constant-time match.
  # Generate with: openssl rand -hex 32
  KIBIGIA_EXCHANGE_SECRET: "<GENERATE_SHARED_SECRET_MATCHING_KIBIGIA>"

  # Add other secrets here if needed
