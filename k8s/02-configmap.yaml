# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: town-builder-config
  namespace: <YOUR_NAMESPACE>
data:
  # Replace with the actual URL of your external town API
  TOWN_API_URL: "http://<YOUR_EXTERNAL_API_DOMAIN>/api/towns/"

  # Kibigia auth-code exchange endpoint. kibigia redirects to town-builder with
  # ?code=<single-use-code>; town-builder POSTs it here (with the shared secret
  # from the Secret) to redeem for a JWT. The host MUST be listed in
  # ALLOWED_DOMAINS below, or the SSRF guard rejects the call.
  KIBIGIA_EXCHANGE_URL: "http://<YOUR_KIBIGIA_DOMAIN>/issues/town-builder/exchange/"

  # Redis URL for SSE and caching
  # Format: redis://<service-name>.<namespace>.svc.cluster.local:<port>/<db>
  REDIS_URL: "redis://valkey.<YOUR_NAMESPACE>.svc.cluster.local:6379/0"

  # CORS Security - REQUIRED in production!
  # Replace with your actual domain(s). Examples:
  # - Single domain: "https://yourdomain.com"
  # - Multiple domains: "https://yourdomain.com,https://app.yourdomain.com"
  # DO NOT use wildcard "*" in production!
  ALLOWED_ORIGINS: "https://<YOUR_DOMAIN>.com"

  # SSRF Protection - Allowed API domains (comma-separated)
  # Only these domains will be allowed for external API calls (prevents SSRF attacks)
  # Must include both your Django API host AND the kibigia exchange host.
  # Example: "localhost,127.0.0.1,api.yourdomain.com,django-service.namespace.svc.cluster.local"
  ALLOWED_DOMAINS: "localhost,127.0.0.1,<YOUR_DJANGO_SERVICE_DOMAIN>"

  # Environment setting
  ENVIRONMENT: "production"

  # Host allowlist - REQUIRED in production!
  # The server refuses to boot without it, and rejects requests whose Host
  # header doesn't match. Set to the public hostname served by the ingress.
  # Health probes are deliberately TCP-socket probes (see 03-deployment.yaml):
  # kubelet cannot send a stable Host header, so HTTP probes would be rejected
  # unless the pod IP were listed here.
  ALLOWED_HOSTS: "town.kibigia.org,localhost,127.0.0.1"

  # CSP frame-ancestors — who may embed this app in an iframe.
  # Defaults to 'self' + the origin of KIBIGIA_EXCHANGE_URL. Override when the
  # kibigia web origin differs from the exchange API origin:
  # FRAME_ANCESTORS: "https://kibigia.org"

  # JWT Configuration (optional - configure in Secret instead if preferred)
  JWT_ALGORITHM: "HS256"
  # DISABLE_JWT_AUTH: "false"  # Uncomment only if using authentication proxy
